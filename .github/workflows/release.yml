name: Release plugins

# Cut a release by pushing a version tag matching manifest.json, e.g.:
#   git tag 0.1.0 && git push origin 0.1.0
# The job builds the plugin and attaches the files Obsidian / BRAT need.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KNOBE_PROTOCOL_DIR: ${{ github.workspace }}/.upstream/knobe-protocol
    steps:
      - uses: actions/checkout@v4

      # The drift guard (test/upstream-sync.test.ts) needs the canonical protocol.
      - name: Check out canonical KNOBE protocol
        uses: actions/checkout@v4
        with:
          repository: KnobeOne/knobe-protocol
          path: .upstream/knobe-protocol

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Verify tag matches the manifest version
        run: |
          V="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$V" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' != version '$V' in manifest.json"
            exit 1
          fi

      - name: Package the plugin
        run: |
          mkdir -p dist/knobe-studio
          cp manifest.json main.js styles.css dist/knobe-studio/
          (cd dist && zip -r knobe-studio.zip knobe-studio)

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            main.js manifest.json styles.css \
            dist/knobe-studio.zip \
            --title "$TAG" \
            --generate-notes
